<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal - Clothing Multitenant</title>
  <link rel="stylesheet" href="/css/store.css">
  <style>
    .admin-layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      min-height: 100vh;
    }
    .sidebar {
      background: var(--primary);
      color: white;
      padding: 1.5rem;
    }
    .sidebar h2 {
      font-size: 1.25rem;
      margin-bottom: 2rem;
    }
    .admin-nav {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .admin-nav a {
      color: #9ca3af;
      text-decoration: none;
      font-weight: 500;
      padding: 0.5rem;
      border-radius: 4px;
      display: block;
    }
    .admin-nav a.active, .admin-nav a:hover {
      background: #1f2937;
      color: white;
    }
    .main-content {
      padding: 2rem;
      background: #f3f4f6;
    }
    .stat-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: white;
      border-radius: 8px;
      padding: 1.5rem;
      border: 1px solid var(--border);
    }
    .stat-card h3 {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }
    .stat-card .value {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--primary);
    }
    .table-container {
      background: white;
      border-radius: 8px;
      border: 1px solid var(--border);
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    th, td {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
    }
    th {
      background: #f9fafb;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .badge {
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-RECEIVED { background: #dbeafe; color: #1e40af; }
    .badge-DISPATCHED { background: #fef3c7; color: #92400e; }
    .badge-DELIVERED { background: #d1fae5; color: #065f46; }
    .auth-box {
      max-width: 400px;
      margin: 5rem auto;
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <!-- Login Screen -->
  <div id="auth-section">
    <div class="auth-box">
      <h2 style="margin-bottom: 1.5rem; text-align: center;">Admin Sign In</h2>
      <form id="admin-login-form">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="login-email" class="form-control" required placeholder="admin@example.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-pwd" class="form-control" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn-checkout" style="background: var(--accent); margin-top: 1rem;">Log In</button>
      </form>
    </div>
  </div>

  <!-- Dashboard Screen -->
  <div class="admin-layout" id="dashboard-section" style="display: none;">
    <aside class="sidebar">
      <h2>Clothing Admin</h2>
      <ul class="admin-nav">
        <li><a href="#" class="active">Overview</a></li>
        <li><a href="#" onclick="logout()">Sign Out</a></li>
      </ul>
      <div style="margin-top: 3rem; font-size: 0.8rem; color: #9ca3af;">
        Signed in as:<br><strong id="current-admin-email" style="color: white;">-</strong>
      </div>
    </aside>

    <main class="main-content">
      <h1 style="margin-bottom: 1.5rem;">Dashboard Overview</h1>

      <div class="stat-cards">
        <div class="stat-card">
          <h3>Total Platform Orders</h3>
          <div class="value" id="stat-total-orders">-</div>
        </div>
        <div class="stat-card">
          <h3>Total Revenue</h3>
          <div class="value" id="stat-total-rev">-</div>
        </div>
        <div class="stat-card">
          <h3>Accessible Brands</h3>
          <div class="value" id="stat-brand-count">-</div>
        </div>
      </div>

      <h2 style="margin-bottom: 1rem;">Managed Brands</h2>
      <div class="table-container" style="margin-bottom: 2.5rem;">
        <table>
          <thead>
            <tr>
              <th>Brand Name</th>
              <th>Slug</th>
              <th>Storefront Link</th>
            </tr>
          </thead>
          <tbody id="brands-table-body">
            <!-- Dynamically populated -->
          </tbody>
        </table>
      </div>

      <h2 style="margin-bottom: 1rem;">Recent Orders & Fulfillment</h2>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Order #</th>
              <th>Brand</th>
              <th>Customer</th>
              <th>Total</th>
              <th>Status</th>
              <th>Courier / Tracking</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="orders-table-body">
            <!-- Orders populated by JS -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="/js/admin.js"></script>
</body>
</html>
