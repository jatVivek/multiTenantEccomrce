version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: clothing_ecom_db
    restart: always
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_pass
      POSTGRES_DB: clothing_setup
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: clothing_ecom_app
    restart: always
    depends_on:
      - db
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://dev_user:dev_pass@db:5432/clothing_setup
      JWT_SECRET: production_jwt_secret_multitenant_app_key_2026
      PORT: 3000

volumes:
  pgdata:
